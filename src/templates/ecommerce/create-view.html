{% include "ecommerce/messages.html" %}

<h1>Crear un nuevo producto</h1>

<form method="POST" action="">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Crear">
</form>

<style>
    :root {
        --color-primary: #2563eb;
        --color-primary-hover: #1d4ed8;
        --color-text: #1f2937;
        --color-text-muted: #6b7280;
        --color-border: #d1d5db;
        --color-border-focus: #2563eb;
        --color-bg: #f9fafb;
        --color-input-bg: #fff;
        --color-error: #dc2626;
        --color-error-bg: #fef2f2;
        --shadow-md: 0 4px 12px rgba(0, 0, 0, .08);
        --radius: 8px;
        --transition: 0.15s ease;
        --max-width: 600px;
        --spacing: 1.5rem;
    }

    form[method="POST"] {
        max-width: var(--max-width);
        margin: 0 auto;
        padding: var(--spacing);
        background: var(--color-input-bg);
        border-radius: var(--radius);
        box-shadow: var(--shadow-md);
        border: 1px solid var(--color-border);
    }

    form[method="POST"]>p {
        margin: 0 0 1rem;
    }

    form[method="POST"] label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--color-text);
        margin-bottom: 0.375rem;
    }

    form[method="POST"] input[type="text"],
    form[method="POST"] input[type="number"],
    form[method="POST"] textarea,
    form[method="POST"] select {
        width: 100%;
        padding: 0.625rem 0.875rem;
        font-size: 1rem;
        font-family: inherit;
        color: var(--color-text);
        background: var(--color-input-bg);
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        transition: border-color var(--transition), box-shadow var(--transition);
        box-sizing: border-box;
    }

    form[method="POST"] input:focus,
    form[method="POST"] textarea:focus,
    form[method="POST"] select:focus {
        outline: none;
        border-color: var(--color-border-focus);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
    }

    form[method="POST"] textarea {
        min-height: 100px;
        resize: vertical;
    }

    form[method="POST"] ul.errorlist {
        margin: 0.375rem 0 0;
        padding: 0;
        list-style: none;
        font-size: 0.75rem;
        color: var(--color-error);
    }

    form[method="POST"] input.error,
    form[method="POST"] textarea.error,
    form[method="POST"] select.error {
        border-color: var(--color-error);
    }

    form[method="POST"] input.error:focus,
    form[method="POST"] textarea.error:focus {
        box-shadow: 0 0 0 3px rgba(220, 38, 38, .15);
    }

    form[method="POST"] input[type="submit"] {
        display: inline-flex;
        align-items: center;
        padding: 0.625rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        color: #fff;
        background: var(--color-primary);
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        transition: background var(--transition), transform var(--transition);
        margin-top: 0.5rem;
    }

    form[method="POST"] input[type="submit"]:hover {
        background: var(--color-primary-hover);
    }

    form[method="POST"] input[type="submit"]:active {
        transform: scale(0.98);
    }

    form[method="POST"] input[type="submit"]:focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
    }

    @media (max-width: 480px) {
        form[method="POST"] {
            padding: 1rem;
            border-radius: 0;
        }
    }
</style>
