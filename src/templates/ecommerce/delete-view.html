{% include "ecommerce/messages.html" %}

<h1>
    Eliminar Producto {{ product.title }}
</h1>

<form method="post">
    {% csrf_token %}
    <p>¿Estas seguro de eliminar el producto {{ product.title }}?</p>
    <input type="submit" value="Eliminar">
    <a href="/ecommerce/{{ product.id }}">Cancelar</a>
</form>

<style>
    :root {
        --color-primary: #2563eb;
        --color-primary-hover: #1d4ed8;
        --color-danger: #dc2626;
        --color-danger-hover: #b91c1c;
        --color-secondary: #6b7280;
        --color-secondary-hover: #4b5563;
        --color-text: #1f2937;
        --color-text-muted: #6b7280;
        --color-border: #d1d5db;
        --color-input-bg: #fff;
        --shadow-md: 0 4px 12px rgba(0, 0, 0, .08);
        --radius: 8px;
        --transition: 0.15s ease;
        --max-width: 500px;
        --spacing: 1.5rem;
    }

    h1 {
        max-width: var(--max-width);
        margin: 0 auto var(--spacing);
        padding: 0 var(--spacing);
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--color-text);
    }

    form[method="post"] {
        max-width: var(--max-width);
        margin: 0 auto;
        padding: var(--spacing);
        background: var(--color-input-bg);
        border-radius: var(--radius);
        box-shadow: var(--shadow-md);
        border: 1px solid var(--color-border);
        text-align: center;
    }

    form[method="post"] p {
        font-size: 1.125rem;
        color: var(--color-text);
        margin: 0 0 1.5rem;
        line-height: 1.6;
    }

    form[method="post"] input[type="submit"],
    form[method="post"] a {
        display: inline-flex;
        align-items: center;
        padding: 0.625rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        text-decoration: none;
        transition: background var(--transition), transform var(--transition);
        margin: 0 0.375rem;
    }

    form[method="post"] input[type="submit"]:active,
    form[method="post"] a:active {
        transform: scale(0.98);
    }

    form[method="post"] input[type="submit"]:focus-visible,
    form[method="post"] a:focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
    }

    form[method="post"] input[type="submit"] {
        background: var(--color-danger);
        color: #fff;
    }

    form[method="post"] input[type="submit"]:hover {
        background: var(--color-danger-hover);
    }

    form[method="post"] a {
        background: var(--color-secondary);
        color: #fff;
    }

    form[method="post"] a:hover {
        background: var(--color-secondary-hover);
    }

    @media (max-width: 480px) {
        form[method="post"] {
            padding: 1rem;
            border-radius: 0;
        }

        h1 {
            padding: 0 1rem;
            font-size: 1.25rem;
        }

        form[method="post"] input[type="submit"],
        form[method="post"] a {
            width: 100%;
            margin: 0.375rem 0;
        }
    }
</style>
